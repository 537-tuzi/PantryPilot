server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Docker 内置 DNS。写成 proxy_pass 里的变量后，nginx 才会在**每次请求时**
    # 通过 resolver 重新解析主机名。
    #
    # 为什么必须这样：proxy_pass 直接写 http://backend:8000 时，nginx 在**启动时**
    # 解析一次并永久缓存该 IP。后端容器一旦重建并拿到新 IP（`dev.sh up`、
    # `--force-recreate`、机器重启都可能触发），前端会持续返回 502，
    # 而后端本身完全正常 —— 必须手动 restart frontend 才能恢复。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端为单页应用，未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        # 变量形式的 proxy_pass 不会自动带上原始 URI，必须显式拼接 $request_uri
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 调用可能较慢
    }

    location = /health {
        set $backend http://backend:8000;
        proxy_pass $backend/health;
        proxy_set_header Host $host;
    }

    location /docs {
        set $backend http://backend:8000;
        proxy_pass $backend/docs;
        proxy_set_header Host $host;
    }

    # OpenAPI 描述文件：/docs 页面依赖它才能加载接口列表
    location = /openapi.json {
        set $backend http://backend:8000;
        proxy_pass $backend/openapi.json;
        proxy_set_header Host $host;
    }
}
