[project]
name = "pantrypilot-backend"
version = "1.1.0"
description = "PantryPilot 后端 API"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# 仅排除已经执行过的历史迁移脚本（不可再改）；alembic/env.py 与后续新迁移仍需通过检查
extend-exclude = ["alembic/versions/20261120_0001_initial_business_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# B008: FastAPI Depends 在默认值中的使用是官方推荐写法
# RUF001/002/003: 中文文档与注释中的全角标点会被误判为歧义字符，中文项目需关闭
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "ai: 需要真实模型或 AI 评测集的用例",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
plugins = []
